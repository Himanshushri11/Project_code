<!DOCTYPE html>
<html lang="en">
<head>
    <title>tic tok toe</title>
    <link rel="stylesheet" href="game.css">
    <link rel="icon" href="tiktoktoe.ico" type="image/x-icon" />
</head>
<body>
    <div class="nev">
        <h1 class="font-sty1">MyTicTokToe.com</h1>
    </div>
    <div class="gamecontenor">
        <div class="contenor">
            <div class="line"></div>
            <div class="box bl-0 bt-0"><span class="boxtext"></span></div>
            <div class="box bt-0"><span class="boxtext"></span></div>
            <div class="box br-0 bt-0"><span class="boxtext"></span></div>
            <div class="box bl-0"><span class="boxtext"></span></div>
            <div class="box"><span class="boxtext"></span></div>
            <div class="box br-0"><span class="boxtext"></span></div>
            <div class="box bl-0 bb-0"><span class="boxtext"></span></div>
            <div class="box bb-0"><span class="boxtext"></span></div>
            <div class="box br-0 bb-0"><span class="boxtext"></span></div>
        </div>
        <div class="info"><span class="info-sty"><h1>Welcome to MyTicTokToe</h1></span>
            <div class="box-2">
              <span class="infowin"><h1></h1></span>
              <button id="reset">Reset</button>
            </div>
            <div class="imgbox">
              <img src="bubududu-panda.gif">
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
